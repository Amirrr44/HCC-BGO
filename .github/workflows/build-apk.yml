name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Project Directory & Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            echo "Project root found!"
            npm install
          elif [ -f "source/package.json" ]; then
            echo "Project found in source/"
            cd source && npm install
          fi

      - name: Build Web App
        run: |
          if [ -f "package.json" ]; then
            npm run build
          elif [ -f "source/package.json" ]; then
            cd source && npm run build
          fi

      - name: Add Android Platform & Sync
        run: |
          if [ -f "package.json" ]; then
            npx cap add android || true
            npx cap sync android
          elif [ -f "source/package.json" ]; then
            cd source
            npx cap add android || true
            npx cap sync android
          fi

      # 👈 استپ جدید: تزریق خودکار مجوز دوربین به AndroidManifest
      - name: Inject Camera Permission
        run: |
          MANIFEST_PATH=""
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          elif [ -f "source/android/app/src/main/AndroidManifest.xml" ]; then
            MANIFEST_PATH="source/android/app/src/main/AndroidManifest.xml"
          fi

          if [ -n "$MANIFEST_PATH" ]; then
            echo "Injecting Camera permissions into $MANIFEST_PATH"
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" />\n    <uses-feature android:name="android.hardware.camera.autofocus" />' "$MANIFEST_PATH"
          else
            echo "AndroidManifest.xml not found!"
            exit 1
          fi

      - name: Build APK with Gradle
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -d "source/android" ]; then
            cd source/android
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            source/android/app/build/outputs/apk/debug/app-debug.apk
